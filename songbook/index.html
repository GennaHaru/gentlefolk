<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentlefolk Songbook</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; background: #fdfdfd; }
        .song-chunk { margin-bottom: 50px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .author { font-style: italic; color: #666; margin-top: 0; }
        .lyrics { white-space: pre-wrap; font-size: 1.1em; }
        nav ul { column-count: 2; list-style: none; padding: 0; }
        nav a { text-decoration: none; color: #00AAFF; }
        nav a:hover { text-decoration: underline; }
        .back-to-top { display: block; margin-top: 10px; font-size: 0.9em; color: #999; text-decoration: none; }
        .lyrics {
    white-space: pre-wrap; /* This tells the browser to keep your line breaks */
    font-size: 1.1em;
    margin-top: 15px;
}
    </style>
</head>
<body>

    <header>
    <h1>Gentlefolk Songbook</h1>
    <input type="text" id="songSearch" placeholder="Search for a song..." onkeyup="filterSongs()" style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">

    <nav id="toc">
        <p>Loading songs...</p>
    </nav>
</header>

    <main id="songbook">
        </main>

    <script>
async function loadSongbook() {
    const toc = document.getElementById('toc');
    const main = document.getElementById('songbook');

    try {
        const response = await fetch('songs.json');
        const songNames = await response.json();

        // 1. Create the Table of Contents immediately
        toc.innerHTML = '<ul>' + songNames.map(name => {
            const id = name.replace(/\s+/g, '-').toLowerCase();
            return `<li><a href="#${id}">${name}</a></li>`;
        }).join('') + '</ul>';

        // 2. Start fetching ALL songs at the same time
        const songPromises = songNames.map(async (name) => {
            const id = name.replace(/\s+/g, '-').toLowerCase();
            const res = await fetch(`songs/${encodeURIComponent(name)}.txt`);
            const text = await res.text();

            // 1. Separate the headers (Title/Author) from the body
            const lines = text.split('\n');
            let title = name, author = "", bodyLines = [];

            lines.forEach(line => {
                if (line.startsWith('Title:')) title = line.replace('Title:', '').trim();
                else if (line.startsWith('Author:')) author = line.replace('Author:', '').trim();
                else bodyLines.push(line);
            });

            // 2. Join the body, fix the bolding globally, then split it back if needed
            // Or just keep it as one string since we use pre-wrap anyway!
            const fullBody = bodyLines.join('\n').replace(/\*\*(.*?)\*\*/gs, '<b>$1</b>');

            return { id, title, author, lyrics: fullBody };
        });

        // 3. Wait for all to finish and dump them into the page
        const allSongs = await Promise.all(songPromises);
        main.innerHTML = allSongs.map(s => `
            <section class="song-chunk" id="${s.id}">
                <h1 class="western">${s.title}</h1>
                ${s.author ? `<p class="author">${s.author}</p>` : ''}
                <div class="lyrics">${s.lyrics}</div>
                <a href="#" class="back-to-top">↑ Back to top</a>
            </section>
        `).join('');

    } catch (e) {
        toc.innerHTML = `<p style="color:red;">Error: ${e.message}</p>`;
    }
}

function filterSongs() {
    const query = document.getElementById('songSearch').value.toLowerCase();
    const links = document.querySelectorAll('#toc li');
    const sections = document.querySelectorAll('.song-chunk');

    // Filter the Table of Contents links
    links.forEach(li => {
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(query) ? '' : 'none';
    });

    // Filter the full song sections in the main area
    sections.forEach(section => {
        const title = section.querySelector('h1').textContent.toLowerCase();
        section.style.display = title.includes(query) ? '' : 'none';
    });
}

        loadSongbook();

    </script>
</body>
</html>
