<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brisbane Ceol Tune Book</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>
</head>
<body>
<header>
    <div class="header-content">
        <div class="header-title-area">
            <img src="logo.png" alt="" class="header-logo">
            <h2 class="header-text">Brisbane Ceol</h2>
        </div>
        <div class="header-btns">
            <button class="head-btn" onclick="toggleQR()">📱 Share QR</button>
            <button class="head-btn" onclick="toggleMail()">📧 Mailing List</button>
            <button class="head-btn" onclick="toggleContact()">👥 Contacts</button>
        </div>
    </div>
</header>

<div class="layout">
    <div id="sidebar">
        <div class="sidebar-header" style="padding: 10px;">
            <button class="update-btn" onclick="forceReset()" style="width: 100%; padding: 12px; background: #00341d; color: white; border: none; border-radius: 6px; font-weight: bold;">🔄 REFRESH APP</button>
        </div>
        <div id="file-list">Loading titles...</div>
    </div>
    <div id="content">
        <div class="tune-header-actions">
            <button id="back-btn" onclick="closeTune()">← Back</button>
        </div>
        <h3 id="tune-title">Select a tune</h3>
        <div id="audio-controls"><div id="midi-player"></div></div>
        <div class="nav-bar" id="setting-nav" style="display:none;"></div>
        <div id="paper"></div>
    </div>
</div>

<div id="qr-overlay" class="modal-overlay" onclick="toggleQR()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <button class="close-modal-x" onclick="toggleQR()">✕</button>
        <img src="qr.png" alt="Scan to share" style="width: 200px; display:block; margin: 0 auto;">
        <p style="margin-top:15px; font-weight:bold; color:#333; text-align:center;">Scan to share book</p>
    </div>
</div>

<div id="mail-overlay" class="modal-overlay" onclick="toggleMail()">
    <div class="modal-card mail-card" onclick="event.stopPropagation()">
        <button class="close-modal-x" onclick="toggleMail()">✕</button>
        <div id="mc_embed_signup">
            <form action="https://quest.us16.list-manage.com/subscribe/post?u=77eefbd6933e8e63fc0871526&amp;id=f453e78893&amp;f_id=009ac2e1f0"
                  method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_blank" onsubmit="handleMailSubmit()">
                <div id="mc_embed_signup_scroll">
                    <h2 style="font-size: 1.2rem; margin-bottom:10px;">Join our Mailing List</h2>
                    <div class="mc-field-group">
                        <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
                        <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required="" value="">
                    </div>
                    <div id="mce-responses" class="clear foot">
                        <div class="response" id="mce-error-response" style="display: none;"></div>
                        <div class="response" id="mce-success-response" style="display: none;"></div>
                    </div>
                    <div style="position: absolute; left: -5000px;" aria-hidden="true">
                        <input type="text" name="b_77eefbd6933e8e63fc0871526_f453e78893" tabindex="-1" value="">
                    </div>
                    <div class="optionalParent" style="margin-top: 20px;">
                        <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe" style="background:#00341d; width:100%; height: 45px;">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="contact-overlay" class="modal-overlay" onclick="toggleContact()">
    <div class="modal-card contact-card" onclick="event.stopPropagation()">
        <button class="close-modal-x" onclick="toggleContact()">✕</button>
        <h2 style="font-size: 1.2rem; margin-bottom:15px;">Contacts</h2>
        <p><strong>Email:</strong> <a href="mailto:bneceol@gmail.com">bneceol@gmail.com</a></p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <p><strong>Follow Us:</strong></p>
        <ul class="social-links">
            <li><a href="https://www.facebook.com/groups/1527011278267149" target="_blank">Facebook Group</a></li>
            <li><a href="https://www.facebook.com/Brisbanetrad" target="_blank">Brisbane Trad Facebook</a></li>
            <li><a href="https://www.instagram.com/bneceol/" target="_blank">Instagram (@bneceol)</a></li>
        </ul>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script type="text/javascript" src="https://s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"></script>
<script type="text/javascript">
    (function($) {window.fnames = new Array(); window.ftypes = new Array();fnames[0]='EMAIL';ftypes[0]='email';}(jQuery));var $mcj = jQuery.noConflict(true);
</script>
<script src="app.js"></script>
</body>
</html>
