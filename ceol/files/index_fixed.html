<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brisbane Ceol Tune Book</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>
</head>
<body>
<header>
    <div class="header-title-area">
        <img src="logo.png" alt="" class="header-logo">
        <h2 style="margin:0; font-size: 1.2rem;">Brisbane Ceol Tune Book</h2>
    </div>
</header>
<div class="layout">
    <div id="sidebar">
        <div class="sidebar-header" style="padding: 10px;">
            <button class="update-btn" onclick="forceReset()" style="width: 100%; padding: 12px; background: #00341d; color: white; border: none; border-radius: 6px; font-weight: bold;">🔄 REFRESH APP</button>
        </div>
        <div id="file-list">Loading titles...</div>
    </div>
    <div id="content">
        <button id="back-btn" onclick="closeTune()">← Back to Tune List</button>
        <h3 id="tune-title">Select a tune</h3>
        <div id="audio-controls" style="margin-bottom: 20px;"><div id="midi-player"></div></div>
        <div class="nav-bar" id="setting-nav" style="display:none;"></div>
        <div id="paper"></div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
