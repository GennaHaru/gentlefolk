<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Newsletter Signup</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link href="//cdn-images.mailchimp.com/embedcode/classic-061523.css" rel="stylesheet" type="text/css">
    <style type="text/css">
        #mc_embed_signup{background:#fff; clear:left; font:14px Helvetica,Arial,sans-serif; width:600px; margin:auto; padding:20px; border:1px solid #ccc; border-radius:10px;}

        #mce-responses { margin-top: 10px; padding: 10px; }
    </style>
</head>
<body>

<div id="mc_embed_signup">

          method="post"
          id="mc-embedded-subscribe-form"
          name="mc-embedded-subscribe-form"
          class="validate">

                <div class="response" id="mce-success-response" style="display:none"></div>
            </div>

            <div style="position: absolute; left: -5000px;" aria-hidden="true">
                <input type="text" name="b_77eefbd6933e8e63fc0871526_f453e78893" tabindex="-1" value="">
            </div>

            <div class="optionalParent">
                <div class="clear foot">
                    <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe">
                </div>
            </div>
        </div>
    </form>
</div>

<script type='text/javascript' src='//s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js'></script>
<script type='text/javascript'>
(function($) {
    window.fnames = new Array();
    window.ftypes = new Array();

var $mcj = jQuery.noConflict(true);
</script>

</body>
</html>
