        :root {
            --bg: #1a1821;           /* Soft dark purplish grey */
            --text: #e5e1eb;         /* White-ish text with soft tint */
            --surface: #25222e;      /* Slightly lighter purplish grey */
            --border: #383345;       /* Muted purple-grey border */
            --accent: #9d8ec4;       /* Soft lavender accent for toast/active states */
            --search-focus: #635875; /* Soft mid-tone purple-grey for focus */
        }
        body {
            font-family: monospace, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
        }
        #search {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            box-sizing: border-box;
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            margin-bottom: 16px;
            position: sticky;
            top: 12px;
            outline: none;
        }
        #search:focus {
            border-color: var(--search-focus);
        }
        #grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 14px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            font-size: 15px;
            user-select: none;
            transition: background 0.1s, border-color 0.1s;
            white-space: nowrap;
        }
        .card:active {
            background: var(--border);
            border-color: var(--accent);
        }
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }
    </style>

        const grid = document.getElementById('grid');

        function render(items) {
            grid.innerHTML = '';
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerText = item.face;
                el.onclick = () => {
                    navigator.clipboard.writeText(item.face);
                    showToast();
                };
                grid.appendChild(el);
            });
        }

        function showToast() {
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 1000);
        }

        search.oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = database.filter(item => item.tags.includes(query) || item.face.includes(query));
            render(filtered);
        };
